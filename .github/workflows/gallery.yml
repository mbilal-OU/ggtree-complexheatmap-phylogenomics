name: Gallery

on:
  push:
    branches: [main]
    paths-ignore:
      - "figures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: bioc::ggtree, bioc::ComplexHeatmap, local::.
      - name: Build all gallery figures
        run: Rscript scripts/build_gallery.R
      - name: Commit reproducible figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures
          if git diff --cached --quiet; then
            echo "Gallery is already current."
          else
            git commit -m "Regenerate Bioconductor gallery [skip ci]"
            git push
          fi

